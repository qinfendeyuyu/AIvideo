    wardrobe: "black tactical long coat, dark gray high-collar shirt, worn metal pendant"
    voice: "lin_yao"
    trigger_words: ["linyao_character", "silver_hair_streak"]
  - name: "苏岚"
    appearance: "young Chinese woman, shoulder-length dark blue hair, sharp brown eyes, calm expression"
