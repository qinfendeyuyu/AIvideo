title: "第一集：裂缝之城"
premise: >-
  近未来城市出现空间裂缝，主角林曜发现裂缝会吞噬人们的记忆。
  他与调查员苏岚合作，追查幕后组织，并阻止城市崩坏。
style_prompt: >-
  dark futuristic Chinese anime comic, cinematic lighting, detailed ink line art,
  controlled color palette, consistent faces, no text
characters:
